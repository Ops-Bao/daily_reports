name: PDF review loop

on:
  repository_dispatch:
    types: [run-cron-job]
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [route, collect]
        default: route
      dry_run:
        description: "Show what would happen without sending anything"
        type: boolean
        default: true

concurrency:
  group: pdf-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Self-test
        run: python -m tests.test_mirror

      - name: Decide mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "dry=${{ inputs.dry_run && '--dry-run' || '' }}" >> "$GITHUB_OUTPUT"
          else
            # Payload sent from Cloudflare repository_dispatch
            PAYLOAD_MODE="${{ github.event.client_payload.mode }}"
            
            # Default to route if mode isn't explicitly 'collect'
            if [ "$PAYLOAD_MODE" = "collect" ]; then
              echo "mode=collect" >> "$GITHUB_OUTPUT"
            else
              echo "mode=route" >> "$GITHUB_OUTPUT"
            fi
            echo "dry=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          REVIEWER_ID: ${{ vars.REVIEWER_ID }}
          ALERT_DESTINATION: ${{ vars.ALERT_DESTINATION }}
          PDF_CHANNELS: ${{ vars.PDF_CHANNELS }}
        run: python mirror_pdfs.py ${{ steps.m.outputs.mode }} ${{ steps.m.outputs.dry }}
