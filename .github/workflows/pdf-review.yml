name: PDF review loop

on:
  # Started by the Cloudflare Worker in worker/ — on a Slack event the moment
  # the reviewer replies (mode: route), and at 05:45 Paris (mode: collect).
  repository_dispatch:
    types: [run-cron-job]
  # Fallback only, for when the Worker or Slack delivery is down. Both modes
  # are idempotent, so these cost nothing when the Worker is working.
  schedule:
    - cron: "53 3,4,5,6 * * *"   # collect
    - cron: "*/30 5-11 * * *"    # route
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [route, collect]
        default: route
      dry_run:
        description: "Show what would happen without sending anything"
        type: boolean
        default: true

concurrency:
  # She can post several comments in a row. Let the running one finish; the
  # newest queued run then scans the whole thread and picks up everything,
  # which is why superseding a pending run loses nothing.
  group: pdf-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Self-test
        run: python -m tests.test_mirror

      - name: Decide mode
        id: m
        env:
          # Via env, never inlined into the script: client_payload is attacker-
          # shaped input and `${{ }}` would paste it straight into bash.
          PAYLOAD_MODE: ${{ github.event.client_payload.mode }}
          CRON: ${{ github.event.schedule }}
          COLLECT_CRON: "53 3,4,5,6 * * *"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "dry=${{ inputs.dry_run && '--dry-run' || '' }}" >> "$GITHUB_OUTPUT"
          else
            # Anything that is not explicitly collect is a route tick.
            if [ "$PAYLOAD_MODE" = "collect" ] || [ "$CRON" = "$COLLECT_CRON" ]; then
              echo "mode=collect" >> "$GITHUB_OUTPUT"
            else
              echo "mode=route" >> "$GITHUB_OUTPUT"
            fi
            echo "dry=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          REVIEWER_ID: ${{ vars.REVIEWER_ID }}
          # mirror_pdfs.py falls back to OPS_DESTINATION, so pass it: an alert
          # with nowhere to go is how weeks of failures stayed invisible.
          ALERT_DESTINATION: ${{ vars.ALERT_DESTINATION }}
          OPS_DESTINATION: ${{ vars.OPS_DESTINATION }}
          PDF_CHANNELS: ${{ vars.PDF_CHANNELS }}
        run: python mirror_pdfs.py ${{ steps.m.outputs.mode }} ${{ steps.m.outputs.dry }}
