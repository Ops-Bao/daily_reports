# ============================================================================
#  WORKFLOW: PDF review loop
# ============================================================================
#
#  TWO MODES, ONE WORKFLOW
#    collect  Gathers last night's PDFs from the 9 #bf-managers-* channels
#             and sends them to Hélène's DM.
#    route    Takes Hélène's threaded replies and posts them back on the
#             original PDF in the right restaurant channel (marks each ✅).
#
#  STARTED BY
#    1. Cloudflare Worker "daily-reports"
#       → repository_dispatch, event "run-pdf-review", with client_payload.mode:
#           "collect"  at 05:45 Paris
#           "route"    the moment Hélène replies (Slack doorbell)
#           "route"    every 30 min (Worker safety net)
#    2. GitHub `schedule` below         (fallback if the Worker is down)
#    3. You, by hand: Actions tab → PDF review loop → Run workflow
#
#  Both modes are idempotent: extra runs cost a minute, never a duplicate post.
#
#  NEEDS (GitHub → Settings → Secrets and variables → Actions)
#    Secrets:   SLACK_BOT_TOKEN
#    Variables: REVIEWER_ID (= U043V696AAE, same as worker/wrangler.toml),
#               PDF_CHANNELS, OPS_DESTINATION, ALERT_DESTINATION
#
#  NOTE: repository_dispatch and schedule only run this file from `main`.
# ============================================================================

name: PDF review loop

on:
  repository_dispatch:
    types: [run-pdf-review]          # must match EVENT_PDF_REVIEW in worker/src/index.js

  schedule:                          # fallback only — GitHub may start these hours late
    - cron: "53 3,4,5,6 * * *"       # collect (must equal COLLECT_CRON below)
    - cron: "*/30 5-11 * * *"        # route

  workflow_dispatch:                 # manual run from the Actions tab
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [route, collect]
        default: route
      dry_run:
        description: "Show what would happen without sending anything"
        type: boolean
        default: true

concurrency:
  # Several replies in a row → runs queue up; the newest one scans the whole
  # thread, so nothing is lost.
  group: pdf-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-test
        run: python -m tests.test_mirror

      # Works out "collect" or "route" from whichever trigger started this run.
      - name: Decide mode
        id: m
        env:
          # Passed via env, never pasted into the script: client_payload comes
          # from outside and could otherwise inject bash commands.
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_MODE: ${{ github.event.client_payload.mode }}
          CRON: ${{ github.event.schedule }}
          COLLECT_CRON: "53 3,4,5,6 * * *"
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$MANUAL_MODE"
            DRY="$MANUAL_DRY"
          elif [ "$PAYLOAD_MODE" = "collect" ] || [ "$CRON" = "$COLLECT_CRON" ]; then
            MODE="collect"; DRY=""
          else
            MODE="route"; DRY=""          # anything not explicitly collect is a route tick
          fi
          echo "Trigger: $EVENT_NAME → mode: $MODE ${DRY:-(live)}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "dry=$DRY"   >> "$GITHUB_OUTPUT"

      - name: Run
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          REVIEWER_ID: ${{ vars.REVIEWER_ID }}
          ALERT_DESTINATION: ${{ vars.ALERT_DESTINATION }}
          OPS_DESTINATION: ${{ vars.OPS_DESTINATION }}
          PDF_CHANNELS: ${{ vars.PDF_CHANNELS }}
        run: python mirror_pdfs.py ${{ steps.m.outputs.mode }} ${{ steps.m.outputs.dry }}