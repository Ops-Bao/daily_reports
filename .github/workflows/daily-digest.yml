# ============================================================================
#  WORKFLOW: Daily digest
# ============================================================================
#
#  STARTED BY
#    1. Cloudflare Worker "daily-reports" at 05:45 Paris
#       → repository_dispatch, event "run-digest"   (the real trigger)
#    2. GitHub `schedule` below                      (fallback if the Worker is down)
#    3. You, by hand: Actions tab → Daily digest → Run workflow
#
#  DOES
#    Reads the 9 restaurant sheets → posts the ops + food-quality digests to Slack.
#    Checks Slack for today's header first, so only ONE digest ever goes out,
#    no matter how many triggers fire.
#
#  NEEDS (GitHub → Settings → Secrets and variables → Actions)
#    Secrets:   GOOGLE_SERVICE_ACCOUNT_JSON, SLACK_BOT_TOKEN,
#               ANTHROPIC_API_KEY (optional: no AI briefing without it)
#    Variables: OPS_DESTINATION, FOOD_DESTINATION, ALERT_DESTINATION,
#               ANTHROPIC_WORKSPACE_ID (optional)
#
#  NOTE: repository_dispatch and schedule only run this file from `main`.
# ============================================================================

name: Daily digest

on:
  repository_dispatch:
    types: [run-digest]              # must match EVENT_DIGEST in worker/src/index.js

  schedule:                          # fallback only — GitHub may start these hours late
    - cron: "43 3 * * *"             # 05:43 Paris summer / 04:43 winter
    - cron: "43 4 * * *"             # 06:43 / 05:43
    - cron: "43 5 * * *"             # 07:43 / 06:43
    - cron: "43 6 * * *"             # 08:43 / 07:43

  workflow_dispatch:                 # manual run from the Actions tab
    inputs:
      dry_run:
        description: "Print the digests instead of posting to Slack"
        type: boolean
        default: true
      date:
        description: "Target date (YYYY-MM-DD), blank = yesterday (last closed day)"
        type: string
        default: ""
      force:
        description: "Post even if today's digest is already in Slack"
        type: boolean
        default: false
      to:
        description: "Send everything to this channel ID instead (rehearsal)"
        type: string
        default: ""
      no_archive:
        description: "Skip the Archive tab (use with the channel override)"
        type: boolean
        default: false

concurrency:
  group: daily-digest                # never two digest runs at once
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fail before posting, not after: a silent N/A-filled digest is worse than none.
      - name: Self-test
        run: python -m tests.test_extract

      - name: Run digest
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          OPS_DESTINATION: ${{ vars.OPS_DESTINATION }}
          FOOD_DESTINATION: ${{ vars.FOOD_DESTINATION }}
          ALERT_DESTINATION: ${{ vars.ALERT_DESTINATION }}
        run: |
          python run_daily.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.no_archive && '--no-archive' || '' }} \
            ${{ inputs.to && format('--to {0}', inputs.to) || '' }} \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }}