name: Daily digest

on:
  # The real trigger: the Cloudflare Worker in worker/ dispatches this at
  # 05:45 Paris. API-started runs begin within seconds, unlike `schedule`.
  repository_dispatch:
    types: [run-digest]
  # Fallback only. The job checks Slack for today's header before posting, so
  # however many of these fire, exactly one digest goes out.
  schedule:
    - cron: "43 3 * * *"   # 05:43 Paris in summer / 04:43 in winter
    - cron: "43 4 * * *"   # 06:43 / 05:43
    - cron: "43 5 * * *"   # 07:43 / 06:43
    - cron: "43 6 * * *"   # 08:43 / 07:43
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digests instead of posting to Slack"
        type: boolean
        default: true
      date:
        description: "Target date (YYYY-MM-DD), blank = yesterday (the report of the last closed day)"
        type: string
        default: ""
      force:
        description: "Post even if today's digest is already in Slack"
        type: boolean
        default: false

concurrency:
  # Several triggers can overlap; never let two runs post twice.
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Fail before posting rather than after. If someone's edit broke the
      # extractor, a silent N/A-filled digest is worse than no digest.
      - name: Self-test
        run: python -m tests.test_extract

      - name: Run digest
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          OPS_DESTINATION: ${{ vars.OPS_DESTINATION }}
          FOOD_DESTINATION: ${{ vars.FOOD_DESTINATION }}
          ALERT_DESTINATION: ${{ vars.ALERT_DESTINATION }}
        run: |
          python run_daily.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
