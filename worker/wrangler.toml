# ============================================================================
#  CLOUDFLARE WORKER "daily-reports" — the alarm clock + doorbell
# ============================================================================
#
#  THE CHAIN
#    Cloudflare cron / Slack reply
#      → this Worker (src/index.js)
#        → GitHub repository_dispatch on Ops-Bao/daily_reports
#          → .github/workflows/daily-digest.yml   (event: run-digest)
#          → .github/workflows/pdf-review.yml     (event: run-pdf-review)
#
#  NAMES THAT MUST MATCH EVERYWHERE
#    Worker name ........ daily-reports      (here + Cloudflare dashboard)
#    GitHub repo ........ Ops-Bao/daily_reports
#    Event: digest ...... run-digest         (index.js + daily-digest.yml)
#    Event: PDF review .. run-pdf-review     (index.js + pdf-review.yml)
#    Reviewer ........... U043V696AAE        (here + GitHub repo variable REVIEWER_ID)
#
#  HOW IT GETS DEPLOYED
#    Automatically: Workers Builds redeploys "daily-reports" on every push
#    to main (root directory: worker/). No need to run wrangler by hand.
#
#  SECRETS (set once, on the "daily-reports" Worker — never in this file)
#    GITHUB_TOKEN          fine-grained PAT, repo Ops-Bao/daily_reports,
#                          permission "Contents: Read and write"
#    SLACK_SIGNING_SECRET  Slack app → Basic Information → Signing Secret
#    Set them in Cloudflare → Workers & Pages → daily-reports → Settings →
#    Variables and Secrets (or: npx wrangler secret put GITHUB_TOKEN).
#
#  SLACK
#    Slack app → Event Subscriptions → Request URL must be this Worker's URL:
#    https://daily-reports.<your-subdomain>.workers.dev
#    Bot event subscribed: message.im
# ============================================================================

name = "daily-reports"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
WORKER_NAME = "daily-reports"        # must equal `name` above (used in logs and /health)
REPO = "Ops-Bao/daily_reports"
DIGEST_HOUR_PARIS = "5"              # morning dispatch fires at :45 of this Paris hour
REVIEWER_ID = "U043V696AAE"          # must equal GitHub repo variable REVIEWER_ID

[triggers]
# Cloudflare crons are always UTC.
#   "45 3 * * *"       = 05:45 Paris in summer  (04:45 in winter → code skips it)
#   "45 4 * * *"       = 05:45 Paris in winter  (06:45 in summer → code skips it)
# Route has NO cron: it only runs when Hélène replies (Slack → fetch()).
crons = ["45 3 * * *", "45 4 * * *"]